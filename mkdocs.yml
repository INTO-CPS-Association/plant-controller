site_name: Plant Controller
repo_url: https://github.com/DisasterlyDisco/plant-controller
docs_dir: docs
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
plugins:
  - search
  - autorefs
  - gen-files:
      scripts:
        - scripts/gen_api_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [pt/controller_3/src]
          options:
            docstring_style: google
            docstring_options:
              warnings: false
            allow_inspection: false
            members_order: source
            show_source: true
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
nav:
  - Home: index.md
  - Hardware:
      - Controller 1:
          - Parts: pt/controller_1/PARTS.md
          - Assembly: pt/controller_1/assembly/ASSEMBLE.md
          - References: pt/controller_1/REFERENCES.md
      - Controller 2:
          - Parts: pt/controller_2/PARTS.md
      - Controller 3:
          - pt/controller_3/index.md
  - API Reference: api/
